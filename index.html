<body>
<div id="app">
  <main class="stage" aria-label="Game area">
    <div id="worldBg"></div>
    <div id="view">
      <div class="hud" id="hud"><div class="hudLeft"><span class="tag" id="levelPill">🎮 Choose a game</span><span class="tag" id="roundPill" hidden>⭐ <span id="roundCount">0/3</span></span></div><div class="hudActions"><button class="roundBtn" id="levelsBtn" hidden>🗺️ Levels</button><button class="roundBtn" id="restartBtn" hidden>↻ Replay</button></div></div>
      <div class="prompt" id="prompt" hidden><span class="promptIcon" id="promptIcon">🎯</span><div class="promptText"><strong id="promptTitle">Choose your adventure</strong><small id="promptHint">Tap to play</small></div><button id="repeatBtn" title="Repeat instruction" aria-label="Repeat instruction">🔊</button></div>
      <div class="playArea" id="playArea" data-mode="home"></div>
    </div>
    <div id="celebration"><div class="celebrationCard"><span>🌟🏆🌟</span><b id="celebrationTitle">Level Up!</b><small id="celebrationText">Next adventure unlocked</small></div></div>
    <div id="levelOverlay" role="dialog" aria-modal="true" aria-label="Choose level"><div class="levelPanel"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="levelHeading">Choose a level</h2><button class="roundBtn" id="closeLevels">✕ Close</button></div><p>Complete levels to unlock the next challenge. Your progress saves on this device.</p><div class="levelTiles" id="levelTiles"></div></div></div>
  </main>
  <aside class="side" aria-label="Game menu"><div class="brand"><div class="brandMark">🌈</div><div><b>Emmy's Adventure Arcade</b><small>Explore · Play · Level Up</small></div></div><div class="sideStats"><div class="stat"><small>🌟 Stars</small><b id="starsValue">0</b></div><div class="stat"><small>🏅 Levels cleared</small><b id="totalLevels">0/84</b></div></div><nav class="sidebarMenu" id="sidebarMenu"></nav><div class="sideBottom"><div class="settingsLine"><label class="toggle" for="voiceSelect">🗣️ Voice</label><select id="voiceSelect"><option value="">System default</option></select></div><div class="settingsLine"><label class="toggle"><input id="voiceToggle" type="checkbox" checked> Narration</label><label class="toggle"><input id="soundToggle" type="checkbox" checked> Sound effects</label></div></div></aside>
</div>
<script>
(function(){'use strict';
const $=s=>document.querySelector(s), area=$('#playArea');
const GAMES=[
 {id:'shapes',name:'Shape Quest',icon:'🔷',desc:'Find colors & shapes'},
 {id:'numbers',name:'Number Lab',icon:'🔢',desc:'Count and solve'},
 {id:'feelings',name:'Mood Detective',icon:'😊',desc:'Read faces & feelings'},
 {id:'seek',name:'Animal Explorer',icon:'🦊',desc:'Find world creatures'},
 {id:'skeleton',name:'Neon Skeletons',icon:'💀',desc:'Make them dance'},
 {id:'basketball',name:'Hoop Hero',icon:'🏀',desc:'Aim and shoot'},
 {id:'soccer',name:'Goal Getter',icon:'⚽',desc:'Beat the moving goalie'},
 {id:'nails',name:'Rainbow Nail Salon',icon:'💅',desc:'Polish, patterns & gems'}
];
const MAX_LEVEL=12, storageKey='emmyArcade_v2';
function loadProgress(){try{const p=JSON.parse(localStorage.getItem(storageKey)||'{}');return p&&typeof p==='object'?p:{}}catch(e){return {}}}
const progress=loadProgress();GAMES.forEach(g=>{progress[g.id]=Math.max(0,Math.min(MAX_LEVEL,Number(progress[g.id])||0))});
let game='home',level=1,round=0,roundLocked=false,session=0,moveTimer=null,rafId=null,pendingTimer=[],drawData=null,lastMoves=[],lastPrompt='',activeVoice=null,availableVoices=[];
const stars=()=>GAMES.reduce((n,g)=>n+progress[g.id]*3,0);
function save(){try{localStorage.setItem(storageKey,JSON.stringify(progress))}catch(e){}}
function cancelRun(){hideSplash();$('#levelOverlay').classList.remove('open');session++;if(rafId)cancelAnimationFrame(rafId);rafId=null;pendingTimer.forEach(clearTimeout);pendingTimer=[];roundLocked=false;moveTimer=null;if(window.speechSynthesis)window.speechSynthesis.cancel()}
function later(fn,ms){const token=session;const id=setTimeout(()=>{if(token===session)fn()},ms);pendingTimer.push(id);return id}
function rand(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function chime(success){if(!$('#soundToggle').checked)return;try{const ctx=chime.ctx||(chime.ctx=new(window.AudioContext||window.webkitAudioContext)());ctx.resume();const notes=success?[784,988,1175]:[195,155];notes.forEach((hz,i)=>{const osc=ctx.createOscillator(),vol=ctx.createGain(),t=ctx.currentTime+i*.10;osc.type=success?'sine':'sawtooth';osc.frequency.value=hz;vol.gain.setValueAtTime(.00001,t);vol.gain.exponentialRampToValueAtTime(success?.10:.04,t+.013);vol.gain.exponentialRampToValueAtTime(.00001,t+.14);osc.connect(vol);vol.connect(ctx.destination);osc.start(t);osc.stop(t+.16)})}catch(e){}}
function speak(t){lastPrompt=t;if(!$('#voiceToggle').checked||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(activeVoice)u.voice=activeVoice;u.rate=.96;u.pitch=1.06;speechSynthesis.speak(u)}catch(e){}}
function loadVoices(){if(!window.speechSynthesis)return;const voices=speechSynthesis.getVoices();if(!voices.length)return;availableVoices=voices.filter(v=>/^en/i.test(v.lang));if(!availableVoices.length)availableVoices=voices;const select=$('#voiceSelect'),previous=select.value;select.innerHTML='';availableVoices.forEach((v,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=v.name;select.appendChild(option)});let target=Number(previous);if(!previous||!availableVoices[target]){const names=/Samantha|Aria|Zira|Victoria|Jenny|Emma|Kendra|Joanna|Serena|Susan|Amy|Karen/i;target=availableVoices.findIndex(v=>names.test(v.name));if(target<0)target=0}select.value=String(target);activeVoice=availableVoices[target]}
if(window.speechSynthesis){speechSynthesis.addEventListener('voiceschanged',loadVoices);loadVoices();later(loadVoices,500)}
$('#voiceSelect').addEventListener('change',e=>{activeVoice=availableVoices[Number(e.target.value)]||null;speak('Ready for adventure!')});$('#voiceToggle').addEventListener('change',e=>{if(!e.target.checked&&window.speechSynthesis)speechSynthesis.cancel();else speak('Narration on')});$('#repeatBtn').addEventListener('click',()=>speak(lastPrompt));
function refreshStats(){$('#starsValue').textContent=String(stars());$('#totalLevels').textContent=GAMES.reduce((n,g)=>n+progress[g.id],0)+'/96';document.querySelectorAll('[data-nav]').forEach(b=>{const id=b.dataset.nav;b.classList.toggle('active',id===game);if(id!=='home'){const label=b.querySelector('.navLevel');if(label)label.textContent=progress[id]+'/12'}})}
function populateMenu(){const menu=$('#sidebarMenu');menu.innerHTML='';[{id:'home',name:'Arcade Home',icon:'🏠',desc:'All the adventures'},...GAMES].forEach(g=>{const b=document.createElement('button');b.type='button';b.className='nav';b.dataset.nav=g.id;b.innerHTML='<span class="navIcon">'+g.icon+'</span><span class="navName"><b>'+g.name+'</b><small>'+g.desc+'</small></span>'+(g.id==='home'?'':'<span class="navLevel">0/12</span>');b.addEventListener('click',()=>openGame(g.id));menu.appendChild(b)})}
function setWorld(name){const themes={home:'radial-gradient(circle at 60% 24%,#7451a58c,transparent 60%),linear-gradient(165deg,#322064,#17364d)',shapes:'radial-gradient(circle at 30% 32%,#6f4dbc9c,transparent 60%),linear-gradient(160deg,#3c287b,#152f49)',numbers:'radial-gradient(circle at 75% 17%,#61c6786a,transparent 55%),linear-gradient(165deg,#173c64,#163b3d)',feelings:'radial-gradient(circle at 25% 30%,#f2588e65,transparent 60%),linear-gradient(165deg,#4a255f,#172a52)',seek:'radial-gradient(circle at 50% 20%,#3cba8f70,transparent 55%),linear-gradient(165deg,#125545,#1b365b)',skeleton:'radial-gradient(circle at 45% 35%,#a448df70,transparent 50%),linear-gradient(165deg,#231450,#0a243a)',basketball:'radial-gradient(circle at 50% 15%,#d46f5b70,transparent 55%),linear-gradient(165deg,#622f50,#2b235f)',soccer:'radial-gradient(circle at 50% 15%,#73dc8765,transparent 55%),linear-gradient(165deg,#135849,#1b285d)',nails:'radial-gradient(circle at 50% 15%,#ff91c37c,transparent 55%),linear-gradient(165deg,#63316b,#27355c)'};$('#worldBg').style.background=themes[name]||themes.home}
function setPrompt(icon,text,hint){$('#prompt').hidden=false;$('#promptIcon').textContent=icon;$('#promptTitle').textContent=text;$('#promptHint').textContent=hint||'Tap the answer';speak(text)}
function updateHud(){const home=game==='home';$('#levelPill').textContent=home?'🎮 8 games · 96 levels':'🎮 Level '+level+' / '+MAX_LEVEL;$('#roundPill').hidden=home;$('#levelsBtn').hidden=home;$('#restartBtn').hidden=home;if(!home){$('#roundCount').textContent=round+'/'+goalRounds();$('#roundPill').setAttribute('aria-label','Round '+round+' out of '+goalRounds())}}
function goalRounds(){return game==='nails'?1:game==='skeleton'?4:game==='basketball'||game==='soccer'?2:3}
function openGame(id,choiceLevel){cancelRun();document.body.classList.toggle('salonOpen',id==='nails');game=id;round=0;level=choiceLevel||Math.min(MAX_LEVEL,progress[id]!==undefined?progress[id]+1:1);refreshStats();updateHud();setWorld(id);area.dataset.mode=id;area.innerHTML='';$('#prompt').hidden=id==='home';if(id==='home'){renderHome();return}renderRound()}
function renderHome(){area.innerHTML='<div class="homeHero"><h1 class="heroTitle">Choose your <span>next adventure.</span></h1><p>Eight worlds, twelve levels each. Earn stars and unlock challenges.</p><span class="tag">🌟 '+stars()+' stars earned so far</span></div><div class="homeGrid" id="homeGrid"></div>';const grid=$('#homeGrid');GAMES.forEach(g=>{const b=document.createElement('button');b.className='homeCard';b.innerHTML='<span class="ico">'+g.icon+'</span><b>'+g.name+'</b><small>'+g.desc+' · '+progress[g.id]+'/12 cleared</small>';b.onclick=()=>openGame(g.id);grid.appendChild(b)})}
function renderRound(){hideSplash();roundLocked=false;updateHud();switch(game){case 'shapes':shapesRound();break;case 'numbers':numbersRound();break;case 'feelings':feelingsRound();break;case 'seek':seekRound();break;case 'skeleton':skeletonRound();break;case 'basketball':sportsRound('basketball');break;case 'soccer':sportsRound('soccer');break;case 'nails':nailsRound();break}}
function celebrateRound(isCorrect,reply){if(roundLocked)return;roundLocked=true;const token=session;chime(isCorrect);if(isCorrect){round++;updateHud();showSplash('✨',reply||'Great job!',false);later(hideSplash,720);if(round>=goalRounds()){later(()=>completeLevel(),1050)}else later(()=>{if(token===session)renderRound()},850)}else{showSplash('💫',reply||'Try again!',false);later(()=>{roundLocked=false;hideSplash()},650)}}
function showSplash(emoji,msg,levelUp){$('#celebrationTitle').textContent=msg;$('#celebrationText').textContent=levelUp?'A new level is now open':'Keep going!';$('#celebration .celebrationCard span').textContent=emoji;$('#celebration').classList.add('show')}
function hideSplash(){$('#celebration').classList.remove('show')}
function completeLevel(){hideSplash();if(game==='home')return;progress[game]=Math.max(progress[game],level);save();refreshStats();showSplash('🏆🌟🏆','LEVEL '+level+' CLEARED!',true);speak('Level '+level+' complete! Amazing!');later(()=>{hideSplash();if(level<MAX_LEVEL){level++;round=0;renderRound()}else{openGame('home')}},1750)}
function answerBtn(inner,key,cb){const b=document.createElement('button');b.type='button';b.className='answer';b.dataset.answer=String(key);b.innerHTML=inner;b.addEventListener('click',()=>{if(roundLocked)return;cb(b,key)});return b}
function reply(b,yes,success){if(yes){b.classList.add('selected-good');celebrateRound(true,success);speak(success)}else{b.classList.add('selected-bad');chime(false);speak('Good try. Look again!');later(()=>{b.classList.remove('selected-bad')},420)}}
// Shape Quest
const COLORS=[{name:'purple',hex:'#a478ff'},{name:'green',hex:'#37d88a'},{name:'red',hex:'#ff627a'},{name:'blue',hex:'#59b5ff'},{name:'yellow',hex:'#ffd36b'}];
const SHAPES=['circle','square','triangle','star','heart','diamond','hexagon','oval'];
function shapeSvg(shape,color){let ins='';const st='fill="'+color+'" stroke="#ffffffb9" stroke-width="4"';if(shape==='circle')ins='<circle cx="50" cy="50" r="35" '+st+'/>';if(shape==='square')ins='<rect x="15" y="15" width="70" height="70" rx="9" '+st+'/>';if(shape==='triangle')ins='<polygon points="50,10 91,84 9,84" '+st+'/>';if(shape==='star')ins='<polygon points="50,6 62,36 94,38 70,58 79,90 50,72 21,90 30,58 6,38 38,36" '+st+'/>';if(shape==='heart')ins='<path d="M50,85 C12,58 8,30 28,23 C42,18 50,28 50,28 C50,28 62,18 76,23 C96,30 88,58 50,85Z" '+st+'/>';if(shape==='diamond')ins='<polygon points="50,7 91,50 50,93 9,50" '+st+'/>';if(shape==='hexagon')ins='<polygon points="28,10 72,10 94,50 72,90 28,90 6,50" '+st+'/>';if(shape==='oval')ins='<ellipse cx="50" cy="50" rx="42" ry="28" '+st+'/>';return '<svg class="optionShape" viewBox="0 0 100 100" aria-hidden="true">'+ins+'</svg>'}
function shapesRound(){const choices=clamp(3+Math.floor((level-1)/3),3,6),kinds=SHAPES.slice(0,clamp(3+Math.floor((level-1)/2),3,8));const targetShape=pick(kinds),color=pick(COLORS.slice(0,clamp(2+Math.floor(level/4),2,5)));const advanced=level>=5;const targetKey=targetShape+'-'+color.name;let opts=[{shape:targetShape,col:color,key:targetKey}];let pool=[];kinds.forEach(sh=>COLORS.forEach(c=>{if(sh+'-'+c.name!==targetKey&&(advanced||sh!==targetShape))pool.push({shape:sh,col:c,key:sh+'-'+c.name})}));opts=shuffle(opts.concat(shuffle(pool).slice(0,choices-1)));setPrompt('🔷',advanced?'Find the '+color.name+' '+targetShape:'Find the '+targetShape,'Look carefully at the colors and outlines');area.innerHTML='<div class="questionArea"><div class="helper">'+(advanced?'Color and shape both matter':'Tap the matching shape')+'</div><div id="answerGrid" class="answerGrid"></div></div>';const grid=$('#answerGrid');opts.forEach(o=>{grid.appendChild(answerBtn(shapeSvg(o.shape,o.col.hex)+'<span class="label">'+(advanced?o.col.name+' ':'')+o.shape+'</span>',o.key,(b,k)=>reply(b,k===targetKey,'You found the '+(advanced?color.name+' ':'')+targetShape+'!')))})}
// Number Lab
function numbersRound(){const n=clamp(1+Math.floor(level*.8),2,12),advanced=level>=5;let a=1,b=0,result=0,operation='',question='',illustration='';if(!advanced){result=Math.floor(rand(1,n+1));const emoji=pick(['🐯','🦊','🐧','🐸','⭐','🍎','🌈']);illustration=Array.from({length:result},()=>emoji).join(' ');question='How many do you see?'}else{a=Math.floor(rand(2,n));b=Math.floor(rand(1,n));const subtract=level>=9&&Math.random()<.5;if(subtract){a=Math.max(a,b);b=Math.min(b,a);result=a-b;operation='−'}else{result=a+b;operation='+'}question='What is '+a+' '+operation+' '+b+'?';illustration='<div class="equation">'+a+' '+operation+' '+b+' = ?</div>'}const opts=[result];let off=1;while(opts.length<3){const plus=result+off,minus=result-off;if(plus>=0&&!opts.includes(plus))opts.push(plus);if(opts.length<3&&minus>=0&&!opts.includes(minus))opts.push(minus);off++}setPrompt('🔢',question,advanced?'Try solving the equation':'Point to each picture while you count');area.innerHTML='<div class="questionArea"><div class="questionIllustration">'+illustration+'</div><div class="answerGrid" id="answerGrid"></div></div>';shuffle(opts).forEach(v=>$('#answerGrid').appendChild(answerBtn('<span class="giant">'+v+'</span>',v,(btn,k)=>reply(btn,Number(k)===result,'Correct! '+result+'!'))))}
// Mood Detective
const MOODS=[{name:'happy',face:'😄'},{name:'sad',face:'😢'},{name:'angry',face:'😠'},{name:'surprised',face:'😲'},{name:'worried',face:'😟'},{name:'excited',face:'🤩'},{name:'calm',face:'😌'},{name:'silly',face:'🤪'}];
const STORIES=[['You just got a big surprise gift!', 'excited'],['A friend says something kind to you.', 'happy'],['Your favorite toy breaks.', 'sad'],['Someone takes your turn without asking.', 'angry'],['You hear a loud thunderclap.', 'surprised'],['You have a big test tomorrow.', 'worried'],['You are relaxing with a book.', 'calm'],['You make a funny face with your friends.', 'silly'],['Your team wins a big game!', 'excited'],['You lose something special.', 'sad'],['Your friend shares a snack.', 'happy'],['A clown makes everyone laugh.', 'silly']];
function feelingsRound(){const pool=MOODS.slice(0,level<4?4:level<8?6:8);let target=pick(pool),question='',advanced=level>=5;if(advanced){const story=pick(STORIES.filter(a=>pool.some(m=>m.name===a[1])));target=MOODS.find(m=>m.name===story[1]);question=story[0]}else question='Find the '+target.name+' face';const distractors=shuffle(pool.filter(m=>m.name!==target.name)).slice(0,level<4?2:3),opts=shuffle([target].concat(distractors));setPrompt('😊',question,advanced?'Which feeling fits this situation?':'Choose the matching expression');area.innerHTML='<div class="questionArea">'+(advanced?'<div class="scenario">'+question+'</div>':'<div class="helper">Read the face</div>')+'<div class="answerGrid" id="answerGrid"></div></div>';opts.forEach(m=>$('#answerGrid').appendChild(answerBtn('<span class="giant">'+m.face+'</span><span class="label">'+m.name+'</span>',m.name,(btn,k)=>reply(btn,k===target.name,'That is '+target.name+'!'))))}
// Animal Explorer
const HABITATS=[{name:'Forest',icon:'🌳',animals:[['🦊','fox'],['🐻','bear'],['🦌','deer'],['🦉','owl'],['🐰','rabbit'],['🦝','raccoon'],['🦔','hedgehog'],['🐿️','squirrel']]},{name:'Desert',icon:'🌵',animals:[['🐪','camel'],['🦂','scorpion'],['🦎','lizard'],['🐍','snake'],['🦅','eagle'],['🦜','parrot'],['🦊','fox']]},{name:'Snow',icon:'❄️',animals:[['🐧','penguin'],['🐻‍❄️','polar bear'],['🦭','seal'],['🐰','rabbit'],['🦉','owl'],['🦊','fox']]},{name:'Ocean',icon:'🌊',animals:[['🐬','dolphin'],['🐙','octopus'],['🐠','fish'],['🦈','shark'],['🦀','crab'],['🦑','squid'],['🐳','whale']]}];const PROPS=['🌲','🌸','🪨','🍄','🌵','🐚','🪸','🌴','❄️','⭐','🌻','🍃','☀️','🧊','🌱','🫧'];let manualHabitat=null;

function nailApply(i,mode=salonTool){if(roundLocked)return;salonSnapshot();const n=salonNails[i];if(mode==='polish'){n.color=salonColor;n.painted=true}else if(mode==='effect'){n.effect=salonEffect;n.painted=true}else if(mode==='gem'){n.gem=salonGem;n.painted=true}else if(mode==='shape'){n.shape=salonShape;n.painted=true}salonSelected=i;salonSave();salonPaint()}
function salonPaint(){if(game!=='nails')return;const stats=salonStats(),challenge=NAIL_GOALS[level-1];$('#salonProgress').textContent=stats.painted+'/5 polished · '+stats.colors+' colors · '+stats.gems+' gems';$('#salonGoal').innerHTML='<strong>'+challenge[0]+'</strong> · '+challenge[1];$('#salonFeedback').textContent=challenge[2](stats)?'✨ You did it! Tap Finish Look to earn your stars!':'💅 Pick a color, tap nails, and make your own design';document.querySelectorAll('.salonNail').forEach((b,i)=>{const n=salonNails[i];b.className='salonNail shape-'+n.shape+(i===salonSelected?' selected':'');b.style.background=nailBackground(n);b.innerHTML='<span class="nailIcon">'+nailAccent(n)+'</span><span class="nailCharm">'+n.gem+'</span>';b.setAttribute('aria-label','Paint nail '+(i+1)+', '+(n.painted?NAIL_COLORS[n.color].n:'unpainted')+', '+n.effect+(n.gem?' with '+n.gem:'') );});document.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('active',Number(b.dataset.color)===salonColor&&salonTool==='polish'));document.querySelectorAll('[data-effect]').forEach(b=>b.classList.toggle('active',b.dataset.effect===salonEffect&&salonTool==='effect'));document.querySelectorAll('[data-gem]').forEach(b=>b.classList.toggle('active',b.dataset.gem===salonGem&&salonTool==='gem'));document.querySelectorAll('[data-shape]').forEach(b=>b.classList.toggle('active',b.dataset.shape===salonShape&&salonTool==='shape'))}
function nailsRound(){setPrompt('💅','Rainbow Nail Salon · '+NAIL_GOALS[level-1][0],'Choose a polish, then tap any nail. Try effects and gems too!');const fingers=Array.from({length:5},(_,i)=>'<div class="salonFinger" data-finger="'+i+'"><button class="salonNail shape-almond" type="button" data-nail="'+i+'" aria-label="Paint nail '+(i+1)+'"></button></div>').join('');area.innerHTML='<div id="nailSalon"><div class="salonScene"><div class="salonHeadline">💖 Design your dream manicure!</div><div class="salonGoal" id="salonGoal"></div><div class="salonPreview"><div class="salonHand"><div class="salonPalm"></div>'+fingers+'</div></div><div class="salonTip" id="salonProgress">0/5 polished</div><button type="button" class="salonQuick" id="salonQuickFinish">✨ Finish my manicure & earn stars!</button><div class="salonTip">👆 Tap a polish, effect, or gem. Tap any nail to use your tool.</div></div><div class="salonControls"><div class="salonSection"><h3>🎨 1. Crazy polish colors</h3><p>Pick a color, then tap the nails you want to paint.</p><div class="salonSwatches" id="salonSwatches"></div></div><div class="salonSection"><h3>🪄 2. Wild patterns & finishes</h3><div class="salonOptions" id="salonEffects"></div></div><div class="salonSection"><h3>💎 3. Gems & charms</h3><div class="salonOptions" id="salonGems"></div></div><div class="salonSection"><h3>💅 4. Nail shapes</h3><div class="salonOptions shapes" id="salonShapes"></div></div><div class="salonSection"><h3>✨ Final touches</h3><div class="salonActions"><button class="salonAction" id="salonAll">🖐 Apply tool to all</button><button class="salonAction" id="salonUndo">↶ Undo</button><button class="salonAction" id="salonRandom">🎲 Surprise me!</button><button class="salonAction" id="salonClear">🧼 Start over</button><button class="salonAction primary" id="salonFinish">✨ Finish look & earn stars!</button></div><div class="salonFeedback" id="salonFeedback"></div></div></div></div>';
 NAIL_COLORS.forEach((c,i)=>{const b=document.createElement('button');b.className='salonSwatch';b.style.background=c.c;b.title=c.n;b.setAttribute('aria-label','Paint '+c.n);b.dataset.color=String(i);b.onclick=()=>{salonColor=i;salonTool='polish';nailApply(salonSelected)};$('#salonSwatches').appendChild(b)});
 NAIL_EFFECTS.forEach(e=>{const b=document.createElement('button');b.className='salonOption';b.dataset.effect=e.id;b.innerHTML='<span>'+e.icon+'</span>'+e.name;b.onclick=()=>{salonEffect=e.id;salonTool='effect';nailApply(salonSelected)};$('#salonEffects').appendChild(b)});
 NAIL_GEMS.forEach(g=>{const b=document.createElement('button');b.className='salonOption';b.dataset.gem=g.id;b.innerHTML='<span>'+g.icon+'</span>'+g.name;b.onclick=()=>{salonGem=g.id;salonTool='gem';nailApply(salonSelected)};$('#salonGems').appendChild(b)});
 NAIL_SHAPES.forEach(shape=>{const b=document.createElement('button');b.className='salonOption';b.dataset.shape=shape;b.textContent=shape[0].toUpperCase()+shape.slice(1);b.onclick=()=>{salonShape=shape;salonTool='shape';nailApply(salonSelected)};$('#salonShapes').appendChild(b)});
 document.querySelectorAll('[data-nail]').forEach(b=>b.onclick=()=>nailApply(Number(b.dataset.nail)));
 $('#salonAll').onclick=()=>{if(roundLocked)return;salonSnapshot();salonNails.forEach(n=>{if(salonTool==='polish'){n.painted=true;n.color=salonColor}else if(salonTool==='effect'){n.painted=true;n.effect=salonEffect}else if(salonTool==='gem'){n.painted=true;n.gem=salonGem}else{n.painted=true;n.shape=salonShape}});salonSave();salonPaint();speak('All five nails styled!')};
 $('#salonUndo').onclick=()=>{if(roundLocked||!salonUndo.length)return;salonNails=JSON.parse(salonUndo.pop());salonSave();salonPaint()};
 $('#salonRandom').onclick=()=>{if(roundLocked)return;salonSnapshot();salonNails=baseNails().map(()=>({painted:true,color:Math.floor(rand(0,NAIL_COLORS.length)),effect:pick(NAIL_EFFECTS).id,gem:Math.random()<.65?pick(NAIL_GEMS.slice(1)).id:'',shape:pick(NAIL_SHAPES)}));salonSave();salonPaint();chime(true);speak('Surprise manicure!')};
 $('#salonClear').onclick=()=>{if(roundLocked)return;salonSnapshot();salonNails=baseNails();salonSave();salonPaint()};
 $('#salonFinish').onclick=()=>{if(roundLocked)return;const c=NAIL_GOALS[level-1],s=salonStats();if(c[2](s)){celebrateRound(true,'Gorgeous manicure!');speak('Beautiful nails! You earned three stars!')}else{const text='Almost there! '+c[1];$('#salonFeedback').textContent='💡 '+text;speak(text);chime(false)}};
 $('#salonQuickFinish').onclick=()=>$('#salonFinish').click();
 salonPaint();}

// Level map and controls
$('#levelsBtn').addEventListener('click',()=>{if(game==='home')return;$('#levelOverlay').classList.add('open');$('#levelHeading').textContent=GAMES.find(g=>g.id===game).name+' · Levels';const tiles=$('#levelTiles');tiles.innerHTML='';for(let n=1;n<=MAX_LEVEL;n++){const b=document.createElement('button');b.className='lvl'+(n<=progress[game]?' done':'')+(n===level?' current':'');b.disabled=n>progress[game]+1;b.innerHTML=n+'<small>'+(n<=progress[game]?'★ ★ ★':n===progress[game]+1?'PLAY':'🔒')+'</small>';b.onclick=()=>{hideSplash();$('#levelOverlay').classList.remove('open');openGame(game,n)};tiles.appendChild(b)}});
$('#closeLevels').addEventListener('click',()=>$('#levelOverlay').classList.remove('open'));
$('#levelOverlay').addEventListener('click',e=>{if(e.target.id==='levelOverlay')$('#levelOverlay').classList.remove('open')});
$('#restartBtn').onclick=()=>openGame(game,level);
// Pure logic diagnostics exposed for testing, and verified in a headless browser.
window.ArcadeDiagnostics={shapeSvg,clamp,goalRounds,stars,progress,openGame,renderRound,nailStats:salonStats,NAIL_GOALS,hideSplash,getGame:()=>game,getLevel:()=>level,round:()=>round,intersectsBallRect:(x,y,r,l,t,w,h)=>{const qx=clamp(x,l,l+w),qy=clamp(y,t,t+h);return (x-qx)**2+(y-qy)**2<=r*r}};
populateMenu();openGame('home');
})();
</script>
</body>
</html>
